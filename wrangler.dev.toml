# Deploy-time config for the "job-tracker-dev" Cloudflare Pages project.
# Not used directly by wrangler (Pages CLI only reads ./wrangler.toml) — scripts/deploy.sh
# copies this file into place before deploying. See DEPLOYMENT.md.
#
# Placeholder values get filled in during first-time dev deployment, once the
# real Cloudflare resources exist (see DEPLOYMENT.md "First-time dev deployment").

name = "job-tracker-dev"
pages_build_output_dir = "frontend/dist"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "career-recall-dev"
database_id = "afe68b45-5dfd-4088-9dee-93afd117b378"

[[r2_buckets]]
binding = "RESUMES"
bucket_name = "career-recall-dev-resumes"

[ai]
binding = "AI"

[browser]
binding = "BROWSER"

[vars]
ACCESS_TEAM_DOMAIN = "boudhayan-dev-pages.cloudflareaccess.com"
ACCESS_AUD = "8acb1ec6f5d9893d659082241c91a11db1b2d18af74aad4e98c7c9dc51b9632d"
