# Local development config for `wrangler pages dev` / `npm run functions:dev`.
# Cloudflare Pages only ever reads ./wrangler.toml (no --config support), so the real
# dev/prod deploy configs live in wrangler.dev.toml / wrangler.prod.toml and get swapped
# into this path by scripts/deploy.sh at deploy time — see DEPLOYMENT.md.

name = "job-tracker"
pages_build_output_dir = "frontend/dist"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "career-recall-local"
database_id = "00000000-0000-0000-0000-000000000000"

[[r2_buckets]]
binding = "RESUMES"
bucket_name = "career-recall-resumes-local"

[ai]
binding = "AI"

[browser]
binding = "BROWSER"

# Left empty for local dev — Access middleware passes every request through when unset.
# Real deploy environments set these (different Access app per dev/prod, see ARCHITECTURE.md).
[vars]
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
