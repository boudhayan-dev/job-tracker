# Deploy-time config for the "job-tracker-prod" Cloudflare Pages project.
# Not used directly by wrangler (Pages CLI only reads ./wrangler.toml) — scripts/deploy.sh
# copies this file into place before deploying. See DEPLOYMENT.md.
#
# Placeholder values get filled in during first-time prod deployment, once the
# real Cloudflare resources exist (see DEPLOYMENT.md "First-time prod deployment").

name = "job-tracker-prod"
pages_build_output_dir = "frontend/dist"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "career-recall-prod"
database_id = "a52b9c5a-ed80-437d-a974-7f24fd4bde8f"

[[r2_buckets]]
binding = "RESUMES"
bucket_name = "career-recall-prod-resumes"

[ai]
binding = "AI"

[browser]
binding = "BROWSER"

[vars]
ACCESS_TEAM_DOMAIN = "boudhayan-dev-pages.cloudflareaccess.com"
ACCESS_AUD = "d6e9de144ad2026d1471b30106f0022b2905492ceaa07c9e738fe0e1f9d43fa9"
